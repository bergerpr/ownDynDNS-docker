name: Build and publish image

# Builds the image from the newest Alpine and the newest ownDynDNS (master),
# runs the smoke test and publishes to Docker Hub as JJ.MM.TT and latest.
#
# Required repository settings (Settings > Secrets and variables > Actions):
#   secret   DOCKERHUB_TOKEN     Docker Hub access token, scope "Read & Write"
#   variable DOCKERHUB_USERNAME  Docker Hub user name
#   secret   DOCKERHUB_DESCRIPTION_TOKEN  (optional) access token with scope
#            "Read, Write, Delete" -- Docker Hub requires it for changing the
#            repository description. Without it the description job is skipped.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly rebuild for Alpine security updates and new upstream commits.
    - cron: "17 4 * * 1" # Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: bergerpr/owndyndns
  PLATFORMS: linux/amd64,linux/arm64
  UPSTREAM_REPO: https://github.com/fernwerker/ownDynDNS.git

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test (amd64)
        run: bash smoke-test.sh

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version and upstream commit
        id: meta
        run: |
          upstream=$(git ls-remote "$UPSTREAM_REPO" refs/heads/master | cut -f1)
          [ -n "$upstream" ] || { echo "::error::could not resolve upstream master"; exit 1; }
          {
            echo "version=$(date -u +%y.%m.%d)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "upstream=$upstream"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $(date -u +%y.%m.%d), ownDynDNS: $upstream" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Always the newest Alpine, and no layer cache: a cached "apk upgrade"
          # layer would keep shipping packages without their security updates.
          pull: true
          no-cache: true
          # Build exactly the commit resolved above, so the label matches the code.
          build-args: |
            OWNDYNDNS_REF=${{ steps.meta.outputs.upstream }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=ownDynDNS
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=GPL-3.0
            eu.kehrwoche.owndyndns.upstream.revision=${{ steps.meta.outputs.upstream }}
          sbom: true
          provenance: mode=max

      - name: Check arm64 image
        run: |
          docker run --rm --platform linux/arm64 --entrypoint php "$IMAGE:${{ steps.meta.outputs.version }}" \
            -r 'echo PHP_VERSION, " ", php_uname("m"), PHP_EOL; exit((int)!extension_loaded("soap"));'

  # Keeps the Docker Hub description in sync with readme.adoc. Docker Hub only
  # renders Markdown, so the README is converted with downdoc first.
  dockerhub-description:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Convert readme.adoc to Markdown
        run: |
          npx --yes downdoc@1.1.0-stable readme.adoc -o README.dockerhub.md
          size=$(wc -c < README.dockerhub.md)
          echo "README.dockerhub.md: $size bytes"
          # Docker Hub limit for the full description.
          [ "$size" -le 25000 ] || { echo "::error::description has $size bytes, Docker Hub allows 25000"; exit 1; }

      - name: Update Docker Hub description
        if: env.HAS_TOKEN == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Hardened ownDynDNS for Netcup: dynamic DNS for FritzBox & co. Rebuilt weekly, amd64/arm64."
          readme-filepath: ./README.dockerhub.md

      - name: Token missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::DOCKERHUB_DESCRIPTION_TOKEN is not set, Docker Hub description not updated"
