# ownDynDNS: Apache hardening and access rules.
# Loaded from /etc/apache2/conf.d/ after httpd.conf.

TraceEnable Off

# Routers (e.g. FritzBox) send user and password in the query string. The access
# log therefore records only method, path and protocol -- never the query string
# or the Referer -- and goes to stdout for `docker logs`.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{User-Agent}i\"" owndyndns
CustomLog /dev/stdout owndyndns

<Directory "/app/public">
    Options -Indexes -FollowSymLinks
    # Kept at "All" for compatibility: users mount their own .htaccess into
    # /app/public (Basic Auth, IP restrictions, "Options -Indexes"). With "None"
    # it would be ignored silently, with a narrower set "Options" lines would
    # turn into a 500. The image itself ships no .htaccess.
    AllowOverride All

    # Whitelist: update.php is the only thing that is ever served.
    # Written as "deny everything else" on purpose: <Files> sections are merged
    # after .htaccess, so a <Files "update.php"> grant would override a Basic
    # Auth or IP restriction a user puts into .htaccess.
    Require all granted
    <FilesMatch "^(?!update\.php$)">
        Require all denied
    </FilesMatch>

    # The application prints exception traces to the client; never let them
    # contain argument values (credentials are passed as arguments).
    php_admin_flag zend.exception_ignore_args on
</Directory>

# The application lives outside the document root; deny it explicitly anyway.
<Directory "/app/owndyndns">
    Require all denied
</Directory>
<Directory "/app/data">
    Require all denied
</Directory>

<IfModule headers_module>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cache-Control "no-store"
</IfModule>
